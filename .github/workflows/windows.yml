name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khitun-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify protected resources
        run: |
          $source = Get-Content src/KhitunGeo/IntegrityVerifier.cs -Raw
          $matches = [regex]::Matches($source, '\["([^"]+)"\]\s*=\s*"([a-f0-9]{64})"')
          if ($matches.Count -ne 23) { throw 'Unexpected integrity manifest' }
          foreach ($entry in $matches) {
            $path = Join-Path 'src/KhitunGeo' $entry.Groups[1].Value
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Groups[2].Value) {
              throw "Integrity check failed: $path"
            }
          }
      - name: Verify coordinate systems
        run: |
          node tests/coordinate-systems.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Coordinate-system regression tests failed' }
          node tests/CoordinateCore/regional-control.cjs
          if ($LASTEXITCODE -ne 0) { throw 'GSK-2011 / MSK-164 control test failed' }
      - name: Verify updater without network or installation
        run: |
          dotnet run --project tests/Updater/Updater.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
          dotnet run --project tests/DwgInterop/DwgInterop.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'DWG native tests failed' }
          node tests/dwg-interop.cjs
          if ($LASTEXITCODE -ne 0) { throw 'DWG overlay tests failed' }
      - name: Verify native migration and browser-free runtime
        run: ./tools/verify-native-runtime.ps1
      - name: Verify workspace tools
        run: node tests/workspace-core.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser interface
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency installation failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Test browser installation failed' }
          node tests/ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser interface tests failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KhitunGeo-UI-check
          path: test-artifacts/*.png
          if-no-files-found: ignore
      - name: Publish Windows x64
        run: |
          dotnet publish src/KhitunGeo/KhitunGeo.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Compile installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/KhitunGeo.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $hash = Get-FileHash dist/KhitunGeo_Setup_1_7_12_x64.exe -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  KhitunGeo_Setup_1_7_12_x64.exe" | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: KhitunGeo-Setup-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: KhitunGeo-App-x64
          path: src/KhitunGeo/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/*
          if-no-files-found: error
          retention-days: 14
