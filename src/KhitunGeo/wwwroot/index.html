function paintColumnSelection(){
  updateTableActionState();
  $('deleteBtn').textContent=selectedColumns.size?'Очистить значения':'Удалить';
  $('pointsHead').querySelectorAll('[data-col]').forEach(th=>{const yes=selectedColumns.has(+th.dataset.col);th.classList.toggle('columnSelected',yes);th.setAttribute('aria-selected',String(yes))});
  $('tbody').querySelectorAll('tr').forEach(tr=>Array.from(tr.children).forEach((td,i)=>td.classList.toggle('columnSelected',selectedColumns.has(i))));
}
function updateTableActionState(){const cols=selectedColumns.size,rows=selected.size;$('deleteBtn').disabled=!cols&&!rows;$('deleteBtn').title=cols?'Очистить значения выбранных столбцов. Ctrl+Z — отменить.':'Удалить выбранные строки. Ctrl+Z — отменить.';$('tableSelectionHint').textContent=cols?`Столбцов выделено: ${cols} · Delete — очистить значения · Ctrl+Z — отменить`:rows?`Строк выделено: ${rows} · Delete — удалить строки · Ctrl+Z — отменить`:'Столбцы: Ctrl + клик — отдельные, Shift — диапазон';}
function selectColumnRange(anchor,end,base=new Set(),remove=false){selectedColumns=new Set(base);for(let i=Math.min(anchor,end);i<=Math.max(anchor,end);i++)if(remove)selectedColumns.delete(i);else selectedColumns.add(i);paintColumnSelection()}
function beginColumnSelection(i,e){document.activeElement?.blur?.();const additive=e.ctrlKey||e.metaKey,anchor=e.shiftKey&&columnAnchor>=0?columnAnchor:i,base=additive?new Set(selectedColumns):new Set(),remove=additive&&!e.shiftKey&&selectedColumns.has(i);selected.clear();paintRowSelection();selectColumnRange(anchor,i,base,remove);if(!e.shiftKey||columnAnchor<0)columnAnchor=i;return {anchor,base,remove}}
$('pointsHead').addEventListener('pointerdown',e=>{const th=e.target.closest('[data-col]');if(!th||e.button!==0)return;e.preventDefault();const i=+th.dataset.col;columnDrag={...beginColumnSelection(i,e),pointerId:e.pointerId};$('pointsHead').setPointerCapture?.(e.pointerId)});
window.addEventListener('pointermove',e=>{if(!columnDrag||e.pointerId!==columnDrag.pointerId)return;if(!(e.buttons&1)){columnDrag=null;return}const th=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-col]');if(th)selectColumnRange(columnDrag.anchor,+th.dataset.col,columnDrag.base,columnDrag.remove)});
for(const name of ['pointerup','pointercancel','blur'])window.addEventListener(name,()=>{columnDrag=null});

function validateTable(){let count=0;for(const tr of $('tbody').querySelectorAll('tr[data-i]')){const p=pts[+tr.dataset.i];let error='';if(String(p.x).trim()||String(p.y).trim()){try{num(p.x);num(p.y);if(String(p.z??'').trim())num(p.z)}catch(e){error=e.message}}tr.classList.toggle('invalid',!!error);tr.title=error;if(error)count++}$('validationStatus').textContent=count?'Ошибок: '+count:'';$('validationStatus').className='status'+(count?' warn':'');return count}
function findPoint(){const query=String($('pointSearch').value).trim().toLowerCase();if(!query)return;const i=pts.findIndex(p=>String(p.no).toLowerCase().includes(query)||String(p.d||'').toLowerCase().includes(query));if(i<0){setStatus('Точка не найдена.','warn');return}selectFromPlot(i,{});setStatus('Найдена точка '+pts[i].no)}
$('pointSearch').addEventListener('input',findPoint);$('pointSearch').addEventListener('keydown',e=>{if(e.key==='Enter')findPoint()});
$('focusSearchBtn').onclick=()=>$('pointSearch').focus();$('fitPlotRailBtn').onclick=fitPlot;$('plotVisibilityBtn').onclick=()=>{setVisualizationEnabled(!visualizationEnabled());setStatus(visualizationEnabled()?'Визуализация показана.':'Визуализация полностью скрыта; таблица расширена.')};
$('redoBtn').onclick=redo;
$('swapSystemsBtn').onclick=()=>{snapshot();const s=$('src').value;$('src').value=$('dst').value;$('dst').value=s;[regionalSelection.src,regionalSelection.dst]=[regionalSelection.dst,regionalSelection.src];[regionalPickerOpen.src,regionalPickerOpen.dst]=[regionalPickerOpen.dst,regionalPickerOpen.src];const p=$('srcZonePrefix').checked;$('srcZonePrefix').checked=$('dstZonePrefix').checked;$('dstZonePrefix').checked=p;resetRegionSearch();refreshUI();scheduleSave();setStatus('Системы поменяны местами. Точки не изменены.')};
$('projectName').addEventListener('input',()=>{$('workspaceProjectName').textContent=$('projectName').value||'Без названия'});
function toggleSidebar(){const shell=$('appShell'),collapsed=shell.classList.toggle('sidebarCollapsed');localStorage.setItem('khitun_geo_sidebar_collapsed',collapsed?'1':'0');$('sidebarToggle').textContent=collapsed?'›':'‹';requestAnimationFrame(renderPlot)}
$('sidebarToggle').onclick=toggleSidebar;
$('sidebarPin').onclick=()=>{const pinned=$('appShell').classList.toggle('sidebarPinned');$('sidebarPin').setAttribute('aria-pressed',String(pinned));localStorage.setItem('khitun_geo_sidebar_pinned',pinned?'1':'0');requestAnimationFrame(renderPlot)};
try{$('appShell').classList.toggle('sidebarCollapsed',localStorage.getItem('khitun_geo_sidebar_collapsed')!=='0');const pinned=localStorage.getItem('khitun_geo_sidebar_pinned')==='1';$('appShell').classList.toggle('sidebarPinned',pinned);$('sidebarPin').setAttribute('aria-pressed',String(pinned))}catch(_){}
document.addEventListener('pointerdown',e=>{const shell=$('appShell');if(!shell.classList.contains('sidebarCollapsed')&&!shell.classList.contains('sidebarPinned')&&!e.target.closest('.navRail'))toggleSidebar();if(!e.target.closest('.navRail'))document.querySelectorAll('.railGroup').forEach(group=>group.open=false);for(const side of ['src','dst']){const field=$(side).closest('.crsField');if(regionalPickerOpen[side]&&!field.contains(e.target))setRegionalPickerOpen(side,false)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open],.modalShade.show')&&(regionalPickerOpen.src||regionalPickerOpen.dst)){regionalPickerOpen.src=regionalPickerOpen.dst=false;refreshUI()}});
document.querySelector('.railLogo')?.addEventListener('click',e=>{e.preventDefault();toggleSidebar()});
document.querySelectorAll('.railGroup').forEach(group=>group.addEventListener('toggle',()=>{if(group.open)document.querySelectorAll('.railGroup').forEach(other=>{if(other!==group)other.open=false})}));
document.querySelectorAll('[data-native]').forEach(button=>button.onclick=()=>{if(window.chrome?.webview)window.chrome.webview.postMessage(button.dataset.native);else setStatus('Эта команда доступна в приложении Windows.','warn')});

function setPlotAddMode(value){plotAddMode=!!value&&visualizationEnabled();$('addPlotPointBtn').setAttribute('aria-pressed',String(plotAddMode));$('canvasWrap').classList.toggle('addPointMode',plotAddMode);setStatus(plotAddMode?'Щёлкните по графику для создания точки. Esc — отмена.':'Режим создания точек выключен.')}
function nextPointNumber(){const numbers=pts.map(p=>Number(p.no)).filter(Number.isFinite);return String(numbers.reduce((a,b)=>Math.max(a,b),0)+1)}
function openPlotPoint(n,e){$('plotPointNo').value=nextPointNumber();$('plotPointX').value=String(n);$('plotPointY').value=String(e);$('plotPointZ').value='0';$('plotPointDesc').value='';$('plotPointError').textContent='';$('plotPointDialog').showModal();$('plotPointZ').focus()}
function addPlotPoint(){try{const p={no:$('plotPointNo').value.trim()||nextPointNumber(),x:String(num($('plotPointX').value)),y:String(num($('plotPointY').value)),z:String(num($('plotPointZ').value)),d:$('plotPointDesc').value};if(isGeo($('src').value)&&(Math.abs(num(p.x))>=90||Math.abs(num(p.y))>180))throw new Error('Широта или долгота выходит за допустимый диапазон.');snapshot();pts.push(p);selected=new Set([pts.length-1]);render();refreshUI();scheduleSave();$('plotPointDialog').close();setPlotAddMode(false);setStatus('Добавлена точка '+p.no+'. Ctrl+Z — отменить.')}catch(e){$('plotPointError').textContent=e.message}}
$('addPlotPointBtn').onclick=()=>setPlotAddMode(!plotAddMode);$('plotPointApply').onclick=addPlotPoint;
$('plotPointCancel').onclick=$('plotPointCloseX').onclick=()=>{$('plotPointDialog').close();setPlotAddMode(false)};
let importBusy=false,dropCounter=0,importChoiceResolve=null;
function hasProjectPoints(){return pts.some(p=>String(p.x??'').trim()||String(p.y??'').trim())}
function chooseImportMode(){if(!hasProjectPoints())return Promise.resolve('replace');return new Promise(resolve=>{importChoiceResolve=resolve;$('importChoiceDialog').showModal()})}
function finishImportChoice(mode){if(importChoiceResolve){const resolve=importChoiceResolve;importChoiceResolve=null;resolve(mode)}$('importChoiceDialog').close()}
$('importChoiceCancel').onclick=()=>finishImportChoice(null);$('importChoiceReplace').onclick=()=>finishImportChoice('replace');$('importChoiceAppend').onclick=()=>finishImportChoice('append');$('importChoiceDialog').addEventListener('cancel',()=>finishImportChoice(null));
function commitImportedPoints(points,mode,source){if(!points.length)throw new Error('Файл не содержит точек.');for(const [i,p]of points.entries()){try{num(p.x);num(p.y);if(String(p.z??'').trim())num(p.z)}catch(e){throw new Error('Строка '+(i+1)+': '+e.message)}}if(mode==='append'&&source&&source!==$('src').value)throw new Error('Нельзя добавить точки другой системы координат. Выберите замену или отдельный проект.');snapshot();pts=mode==='append'?pts.concat(points):points;if(source&&mode!=='append')$('src').value=source;selected.clear();lastSelected=-1;render();refreshUI();requestAnimationFrame(fitPlot);scheduleSave();setStatus('Импортировано точек: '+points.length+'. Ctrl+Z — отменить.')}
function jsonPointSource(o){return o?.source&&CRS[o.source]?o.source:o?.type==='FeatureCollection'||o?.pointInfoArray?'wgs':null}
async function importFile(file,options={}){
 if(/\.dwg$/i.test(file.name)&&typeof openDwgImport==='function'){await openDwgImport(file);return;}
 if(/\.dxf$/i.test(file.name)&&typeof openDxfImport==='function'){await openDxfImport(file);return;}
  if(importBusy){setStatus('Дождитесь завершения текущего импорта.','warn');return}importBusy=true;
  try{
    if(!/\.(csv|txt|xyz|pnt|dat|asc|json|geojson)$/i.test(file.name))throw new Error('Неподдерживаемый файл. Используйте CSV, TXT, XYZ, PNT, JSON или GeoJSON.');
    if(file.size>32*1024*1024)throw new Error('Файл больше 32 МБ. Разделите его на несколько файлов.');
    if(/\.(json|geojson)$/i.test(file.name)){
      const o=JSON.parse(await file.text()),points=parseJsonPoints(o);
      if(options.project||(o.app==='Khitun Geo'&&Array.isArray(o.points))){flushSave();const previous=undoState();applyProjectPayload(o);currentProjectId=uid();history=[previous];redoHistory=[];scheduleSave();setStatus('Проект открыт. Ctrl+Z — отменить.');return}
      const mode=await chooseImportMode();if(!mode)return;commitImportedPoints(points,mode,jsonPointSource(o));return;
    }
    await openImportWizard(file,options.preset||'auto');
    if(!options.quick)return;
    const rows=parseImportRows(importWizard.text,importWizard.delimiter),headers=importWizard.header?rows[0]:[],data=importWizard.rows,preset=$('impPreset').value;
    const columns=['mapX','mapY','mapZ','mapNo','mapD'].map(id=>Number($(id).value)).filter(i=>i>=0);
    const confident=importWizard.header&&['autocad_xy','wgs_bl','civil_pnezd','civil_nez','civil_enz'].includes(preset)&&new Set(columns).size===columns.length&&data.every(r=>looksNumeric(r[Number($('mapX').value)])&&looksNumeric(r[Number($('mapY').value)])&&(Number($('mapZ').value)<0||looksNumeric(r[Number($('mapZ').value)])));
    if(confident){$('importModal').classList.remove('show');const mode=await chooseImportMode();if(!mode){closeImportWizard();return}$('impMode').value=mode;applyImportWizard()}
  }catch(e){setStatus('Ошибка импорта: '+e.message,'warn');alert(e.message)}finally{importBusy=false}
}
document.addEventListener('dragenter',e=>{if(!Array.from(e.dataTransfer?.types||[]).includes('Files'))return;e.preventDefault();dropCounter++;$('dropOverlay').hidden=false});
document.addEventListener('dragover',e=>{if(Array.from(e.dataTransfer?.types||[]).includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy'}});
document.addEventListener('dragleave',()=>{dropCounter=Math.max(0,dropCounter-1);if(!dropCounter)$('dropOverlay').hidden=true});
document.addEventListener('drop',async e=>{e.preventDefault();dropCounter=0;$('dropOverlay').hidden=true;const files=Array.from(e.dataTransfer?.files||[]);if(files.length!==1){setStatus('Перетащите один файл за раз.','warn');return}await importFile(files[0],{quick:true})});
$('fileInput').onchange=async e=>{const file=e.target.files[0];if(file)await importFile(file,{project:e.target.dataset.mode==='project',preset:e.target.dataset.preset});e.target.value=''};
$('importBtn').onclick=()=>{closeExchangeMenus();$('fileInput').dataset.mode='wizard';$('fileInput').dataset.preset='auto';$('fileInput').accept='.dwg,.dxf,.csv,.txt,.xyz,.pnt,.dat,.asc,.json,.geojson';$('fileInput').click()};
$('exportWizardBtn').onclick=()=>{closeExchangeMenus();openExportWizard()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){setPlotAddMode(false);selectedColumns.clear();selected.clear();paintColumnSelection();paintRowSelection()}if((e.ctrlKey||e.metaKey)&&e.code==='KeyF'){e.preventDefault();$('pointSearch').focus()}if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.isComposing&&(e.code==='KeyY'||(e.shiftKey&&e.code==='KeyZ'))){const editing=e.target?.closest?.('input,textarea,[contenteditable="true"]');if(!document.querySelector('dialog[open],.modalShade.show')&&(!editing||e.target.closest('#tbody'))){e.preventDefault();redo()}}});

try{applyInterfaceTheme(localStorage.getItem(THEME_KEY)||'1',false)}catch(_){applyInterfaceTheme('1',false)}
initPlotEvents();try{if(!restoreLastProject()){render();refreshUI();saveLocalNow()}}catch(e){render();refreshUI();setStatus('Не удалось открыть хранилище: '+e.message,'warn');alert('Проекты не перезаписаны. Не удалось открыть хранилище: '+e.message+' Восстановите резервную копию через меню приложения.');}selfTest();requestAnimationFrame(fitPlot);
loadRegionalCatalogues();
window.chrome?.webview?.addEventListener('message',event=>{const data=event.data;if(data?.type!=='app-update')return;$('appUpdateStatus').textContent=String(data.text||'');$('updateCheckBtn').disabled=!!data.busy;$('updateCancelBtn').hidden=!data.busy;$('updateInstallBtn').hidden=$('updateHelpInstallBtn').hidden=!data.ready;});
requestAnimationFrame(()=>{try{if(localStorage.getItem(WELCOME_KEY)!=='1')openWelcome()}catch(_){openWelcome()}});

</script>
